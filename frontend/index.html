<!DOCTYPE html>
<html>
<head>
    <title>Voice AI Agent Prototype</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; }
        #startBtn { background: #4CAF50; color: white; }
        #stopBtn { background: #f44336; color: white; display: none; }
        #status { margin-top: 20px; font-weight: bold; color: #555; }
        #chat { margin-top: 30px; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 8px; height: 300px; overflow-y: auto;}
        .user { color: blue; margin-bottom: 10px; }
        .ai { color: green; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Mario's Restaurant AI</h2>
    <button id="startBtn">Start Call</button>
    <button id="stopBtn">End Call</button>
    <div id="status">Status: Disconnected</div>
    <div id="chat"></div>

    <script>
        let socket;
        let mediaRecorder;
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusEl = document.getElementById('status');
        const chatEl = document.getElementById('chat');

        // --- 1. AUDIO QUEUE SYSTEM (Prevents overlapping audio) ---
        let audioQueue = [];
        let isPlaying = false;
        let currentAudio = null;

        function playNextAudio() {
            if (audioQueue.length === 0) {
                isPlaying = false;
                return;
            }
            isPlaying = true;
            const audioBlob = audioQueue.shift();
            const audioUrl = URL.createObjectURL(audioBlob);
            currentAudio = new Audio(audioUrl);
            
            // When this sentence finishes, play the next one automatically
            currentAudio.onended = () => { playNextAudio(); };
            currentAudio.play();
        }

        function clearAudioQueue() {
            audioQueue = []; 
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            isPlaying = false;
        }
        // -----------------------------------------------------------

        let currentAiDiv = null;

        startBtn.onclick = async () => {
            socket = new WebSocket(`ws://${window.location.host}/ws`);
            
            socket.onopen = async () => {
                statusEl.innerText = "Status: Connected & Listening...";
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && socket.readyState === WebSocket.OPEN) {
                        socket.send(event.data);
                    }
                };
                mediaRecorder.start(250);
            };

            socket.onmessage = async (event) => {
                if (typeof event.data === "string") {
                    const data = JSON.parse(event.data);
                    
                    // User interrupted -> Backend says stop playing!
                    if (data.role === "clear_audio") {
                        clearAudioQueue();
                        currentAiDiv = null;
                        return;
                    }
                    
                    // Stream text to UI dynamically
                    if (data.role === "ai_chunk") {
                        if (!currentAiDiv) {
                            currentAiDiv = document.createElement("div");
                            currentAiDiv.className = "ai";
                            currentAiDiv.innerHTML = `<b>AI:</b> ${data.text}`;
                            chatEl.appendChild(currentAiDiv);
                        } else {
                            currentAiDiv.innerHTML += data.text;
                        }
                        chatEl.scrollTop = chatEl.scrollHeight;
                    } 
                    else if (data.role === "user") {
                        currentAiDiv = null; // Reset AI block
                        chatEl.innerHTML += `<div class="user"><b>USER:</b> ${data.text}</div>`;
                        chatEl.scrollTop = chatEl.scrollHeight;
                    }
                } else {
                    // 2. Receive Complete MP3 file and Queue it!
                    const audioBlob = new Blob([event.data], { type: 'audio/mp3' });
                    audioQueue.push(audioBlob);
                    
                    if (!isPlaying) { playNextAudio(); }
                }
            };
        };

        stopBtn.onclick = () => {
            if (mediaRecorder) mediaRecorder.stop();
            if (socket) socket.close();
            clearAudioQueue();
            statusEl.innerText = "Status: Disconnected";
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        };
    </script>
</body>
</html>
